<h2>{{ id ? 'Editar' : 'Nueva' }} prestación</h2>
@if (error()) {
  <div class="alerta" role="alert">{{ error() }}</div>
}
@if (cargando()) {
  <p role="status">Cargando…</p>
}
<form class="card" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <fieldset class="form-fields" [disabled]="cargando() || guardando() || cargaFallida()">
    <div class="form-grid">
      <label
        >Código PRS-000<input class="input" type="text" formControlName="codigo" /><app-campo-error
          [control]="form.controls.codigo"
          [mensaje]="campos()['codigo']" /></label
      ><label
        >Nombre<input class="input" type="text" formControlName="nombre" /><app-campo-error
          [control]="form.controls.nombre"
          [mensaje]="campos()['nombre']" /></label
      ><label
        >Precio<input
          class="input"
          type="number"
          formControlName="precio"
          min="0.01"
          step="0.01" /><app-campo-error
          [control]="form.controls.precio"
          [mensaje]="campos()['precio']" /></label
      ><label
        >Especie aplicable<select class="input" formControlName="especieAplicable">
          <option value="">Seleccione</option>
          <option value="PERRO">PERRO</option>
          <option value="GATO">GATO</option>
          <option value="TODAS">TODAS</option></select
        ><app-campo-error
          [control]="form.controls.especieAplicable"
          [mensaje]="campos()['especieAplicable']"
      /></label>
    </div>
    <div class="actions">
      <a class="btn" routerLink="/prestaciones">Cancelar</a
      ><button class="btn btn-primary" type="submit" [disabled]="guardando()">
        {{ guardando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </fieldset>
</form>
